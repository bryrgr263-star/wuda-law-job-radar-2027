name: Keep scheduled workflows active

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Record monthly repository activity
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/workflow-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflow-keepalive.txt
          git commit -m "chore: keep scheduled workflows active [skip ci]"
          git push
