name: Ingestion foundation CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Phase 1 and production TypeScript
        run: pnpm ci:phase1
